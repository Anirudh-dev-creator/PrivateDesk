name: Build PrivateDesk for Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/compressor
            crates/tools

      - name: Test compression engine
        working-directory: crates/compressor
        run: cargo test --release

      - name: Test image, passport and utility tools
        working-directory: crates/tools
        run: cargo test --release

      - name: Install frontend packages
        run: npm install

      - name: Build installer and exe
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer (setup .exe)
        uses: actions/upload-artifact@v4
        with:
          name: PrivateDesk-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: PrivateDesk-portable-exe
          path: src-tauri/target/release/privatedesk.exe

      - name: Attach files to GitHub Release (only for version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/privatedesk.exe
