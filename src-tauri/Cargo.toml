[package]
name = "privatedesk"
version = "0.1.0"
description = "PrivateDesk - offline document and file tools"
edition = "2021"

[lib]
name = "privatedesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
pd_compressor = { path = "../crates/compressor" }

[profile.release]
lto = true
codegen-units = 1
strip = true
